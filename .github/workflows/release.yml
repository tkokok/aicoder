name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build:release

      - name: Package release assets
        run: |
          mkdir -p release/aicoder
          cp -r dist frontend agents schemas package.json README.md start.sh .env.example release/aicoder/
          tar -czf aicoder-${{ github.ref_name }}.tar.gz -C release aicoder
          zip -rq aicoder-${{ github.ref_name }}.zip release/aicoder

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aicoder-${{ github.ref_name }}.tar.gz
            aicoder-${{ github.ref_name }}.zip
          generate_release_notes: true
