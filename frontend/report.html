<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Report - AICoder</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* Design System - CSS Variables */
    :root {
      /* Colors */
      --color-bg: #0a0a0f;
      --color-surface: #12121a;
      --color-surface-elevated: #1a1a24;
      --color-border: #2a2a3a;
      --color-border-subtle: #1f1f2a;
      
      --color-text-primary: #f0f0f5;
      --color-text-secondary: #a0a0b0;
      --color-text-muted: #606070;
      
      --color-accent: #00d4aa;
      --color-accent-hover: #00f5c4;
      --color-accent-subtle: rgba(0, 212, 170, 0.1);
      
      --color-error: #ff4757;
      --color-error-subtle: rgba(255, 71, 87, 0.1);
      --color-warning: #ffa502;
      --color-success: #2ed573;
      
      /* Typography */
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace;
      
      --text-xs: 0.75rem;
      --text-sm: 0.875rem;
      --text-base: 1rem;
      --text-lg: 1.125rem;
      --text-xl: 1.25rem;
      --text-2xl: 1.5rem;
      --text-3xl: 2rem;
      
      --leading-tight: 1.25;
      --leading-normal: 1.5;
      --leading-relaxed: 1.75;
      
      /* Spacing */
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-10: 2.5rem;
      --space-12: 3rem;
      --space-16: 4rem;
      
      /* Border Radius */
      --radius-sm: 0.25rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-xl: 1rem;
      
      /* Shadows */
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.5);
      
      /* Transitions */
      --transition-fast: 150ms ease;
      --transition-normal: 250ms ease;
      --transition-slow: 350ms ease;
    }
    
    /* Reset & Base */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    body {
      font-family: var(--font-sans);
      font-size: var(--text-base);
      line-height: var(--leading-normal);
      color: var(--color-text-primary);
      background: var(--color-bg);
      min-height: 100vh;
    }
    
    /* Layout */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: var(--space-6);
    }
    
    /* Header */
    .header {
      margin-bottom: var(--space-8);
      padding-bottom: var(--space-6);
      border-bottom: 1px solid var(--color-border-subtle);
    }
    
    .header__title {
      font-size: var(--text-3xl);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: var(--space-2);
    }
    
    .header__subtitle {
      color: var(--color-text-secondary);
      font-size: var(--text-sm);
    }
    
    /* Metadata Card */
    .metadata {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: var(--space-4);
      margin-bottom: var(--space-8);
    }
    
    .metadata__item {
      background: var(--color-surface);
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
    }
    
    .metadata__label {
      font-size: var(--text-xs);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--color-text-muted);
      margin-bottom: var(--space-1);
    }
    
    .metadata__value {
      font-size: var(--text-sm);
      color: var(--color-text-primary);
      font-weight: 500;
    }
    
    .metadata__value--status {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-warning);
    }
    
    .status-dot--completed {
      background: var(--color-success);
    }
    
    .status-dot--error {
      background: var(--color-error);
    }
    
    /* Content Area */
    .content {
      background: var(--color-surface);
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-xl);
      padding: var(--space-8);
      min-height: 400px;
    }
    
    /* Markdown Styles */
    .markdown-body {
      color: var(--color-text-primary);
      line-height: var(--leading-relaxed);
    }
    
    .markdown-body h1 {
      font-size: var(--text-2xl);
      font-weight: 700;
      margin-bottom: var(--space-4);
      padding-bottom: var(--space-3);
      border-bottom: 1px solid var(--color-border);
    }
    
    .markdown-body h2 {
      font-size: var(--text-xl);
      font-weight: 600;
      margin-top: var(--space-8);
      margin-bottom: var(--space-4);
    }
    
    .markdown-body h3 {
      font-size: var(--text-lg);
      font-weight: 600;
      margin-top: var(--space-6);
      margin-bottom: var(--space-3);
    }
    
    .markdown-body p {
      margin-bottom: var(--space-4);
      color: var(--color-text-secondary);
    }
    
    .markdown-body ul, .markdown-body ol {
      margin-bottom: var(--space-4);
      padding-left: var(--space-6);
    }
    
    .markdown-body li {
      margin-bottom: var(--space-2);
      color: var(--color-text-secondary);
    }
    
    .markdown-body code {
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      background: var(--color-surface-elevated);
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-sm);
      color: var(--color-accent);
    }
    
    .markdown-body pre {
      background: var(--color-surface-elevated);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      margin-bottom: var(--space-4);
      overflow-x: auto;
    }
    
    .markdown-body pre code {
      background: none;
      padding: 0;
      color: var(--color-text-primary);
    }
    
    .markdown-body blockquote {
      border-left: 3px solid var(--color-accent);
      padding-left: var(--space-4);
      margin-bottom: var(--space-4);
      color: var(--color-text-secondary);
      font-style: italic;
    }
    
    .markdown-body a {
      color: var(--color-accent);
      text-decoration: none;
      transition: color var(--transition-fast);
    }
    
    .markdown-body a:hover {
      color: var(--color-accent-hover);
      text-decoration: underline;
    }
    
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: var(--space-4);
    }
    
    .markdown-body th, .markdown-body td {
      border: 1px solid var(--color-border);
      padding: var(--space-3);
      text-align: left;
    }
    
    .markdown-body th {
      background: var(--color-surface-elevated);
      font-weight: 600;
    }
    
    .markdown-body hr {
      border: none;
      border-top: 1px solid var(--color-border);
      margin: var(--space-8) 0;
    }
    
    /* Loading State */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-16);
      color: var(--color-text-muted);
    }
    
    .loading__spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--color-border);
      border-top-color: var(--color-accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: var(--space-4);
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading__text {
      font-size: var(--text-sm);
    }
    
    /* Error State */
    .error {
      background: var(--color-error-subtle);
      border: 1px solid var(--color-error);
      border-radius: var(--radius-lg);
      padding: var(--space-6);
      text-align: center;
    }
    
    .error__icon {
      font-size: var(--text-3xl);
      margin-bottom: var(--space-3);
    }
    
    .error__title {
      font-size: var(--text-lg);
      font-weight: 600;
      margin-bottom: var(--space-2);
      color: var(--color-error);
    }
    
    .error__message {
      color: var(--color-text-secondary);
      font-size: var(--text-sm);
      margin-bottom: var(--space-4);
    }
    
    .error__retry {
      background: transparent;
      border: 1px solid var(--color-error);
      color: var(--color-error);
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .error__retry:hover {
      background: var(--color-error);
      color: var(--color-bg);
    }
    
    /* Pending State */
    .pending {
      text-align: center;
      padding: var(--space-16);
    }
    
    .pending__icon {
      font-size: var(--text-3xl);
      margin-bottom: var(--space-4);
    }
    
    .pending__title {
      font-size: var(--text-xl);
      font-weight: 600;
      margin-bottom: var(--space-2);
    }
    
    .pending__message {
      color: var(--color-text-secondary);
      font-size: var(--text-sm);
    }
    
    /* Responsive */
    @media (max-width: 640px) {
      .container {
        padding: var(--space-4);
      }
      
      .content {
        padding: var(--space-4);
      }
      
      .header__title {
        font-size: var(--text-2xl);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="header__title">Session Report</h1>
      <p class="header__subtitle">AI-generated project analysis and recommendations</p>
    </header>
    
    <section class="metadata" id="metadata">
      <!-- Metadata items will be injected here -->
    </section>
    
    <main class="content" id="content">
      <!-- Content will be injected here -->
    </main>
  </div>
  
  <script type="module" src="./report.js"></script>
</body>
</html>
