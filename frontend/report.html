<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Report - AICoder</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0b0c0f;
      --surface: #12131a;
      --surface-2: #1a1c24;
      --border: #2a2d38;
      --text: #e8eaf0;
      --text-secondary: #9aa0ae;
      --text-muted: #5e6470;
      --accent: #60a5fa;
      --accent-2: #22d3ee;
      --success: #34d399;
      --warning: #fbbf24;
      --error: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans", Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      font-size: 14px;
      line-height: 1.45;
      margin: 0;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 20px 40px;
    }
    header.topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0 18px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .topbar h1 {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
      letter-spacing: 0.2px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }
    .btn:hover { border-color: var(--text-muted); }
    .btn-secondary { color: var(--text-secondary); }

    .info-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 16px;
      font-size: 13px;
    }
    .info-table th, .info-table td {
      padding: 8px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    .info-table th {
      width: 120px;
      color: var(--text-muted);
      font-weight: 500;
      white-space: nowrap;
      background: rgba(255,255,255,0.02);
    }
    .info-table td { color: var(--text-secondary); word-break: break-all; }
    .info-table tr:last-child th, .info-table tr:last-child td { border-bottom: none; }
    .info-table td > span { color: var(--text); }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-secondary);
    }
    .badge.completed { color: var(--success); border-color: rgba(52,211,153,0.35); background: rgba(52,211,153,0.12); }
    .badge.error { color: var(--error); border-color: rgba(248,113,113,0.35); background: rgba(248,113,113,0.12); }
    .badge.pending { color: var(--warning); border-color: rgba(251,191,36,0.35); background: rgba(251,191,36,0.12); }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .panel-body { padding: 16px; min-height: 320px; }

    /* Markdown */
    .markdown-body { color: var(--text); line-height: 1.7; font-size: 14px; }
    .markdown-body h1 { font-size: 20px; font-weight: 700; margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .markdown-body h2 { font-size: 16px; font-weight: 700; margin: 20px 0 10px; }
    .markdown-body h3 { font-size: 15px; font-weight: 600; margin: 16px 0 8px; }
    .markdown-body p { margin: 0 0 10px; color: var(--text-secondary); }
    .markdown-body ul, .markdown-body ol { margin: 0 0 10px; padding-left: 20px; }
    .markdown-body li { margin: 4px 0; color: var(--text-secondary); }
    .markdown-body code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12.5px;
      background: var(--surface-2);
      padding: 2px 6px;
      border-radius: 6px;
      color: var(--accent-2);
    }
    .markdown-body pre {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin: 0 0 12px;
      overflow-x: auto;
    }
    .markdown-body pre code { background: none; padding: 0; color: var(--text); }
    .markdown-body blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 12px;
      margin: 0 0 12px;
      color: var(--text-secondary);
      font-style: italic;
    }
    .markdown-body a { color: var(--accent); }
    .markdown-body table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
    .markdown-body th, .markdown-body td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
    .markdown-body th { background: var(--surface-2); font-weight: 600; }
    .markdown-body hr { border: none; border-top: 1px solid var(--border); margin: 18px 0; }

    .loading, .error, .pending { padding: 50px 20px; text-align: center; }
    .loading__spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: var(--error); }
    .pending { color: var(--text-secondary); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <h1>Session Report</h1>
      <a id="back-link" href="/" class="btn btn-secondary">← Back to Projects</a>
    </header>

    <table class="info-table">
      <tbody id="metadata-body">
        <!-- Metadata rows injected here -->
      </tbody>
    </table>

    <div class="panel">
      <div class="panel-body" id="content">
        <!-- Content injected here -->
      </div>
    </div>
  </div>

  <script type="module" src="./report.js"></script>
</body>
</html>
